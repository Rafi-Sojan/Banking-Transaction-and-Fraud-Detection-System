services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking_fraud}
      POSTGRES_USER: ${POSTGRES_USER:-banking_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: banking-fraud-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
