name: C++ CI

on:
  push:
    paths:
      - "cpp/**"
  pull_request:
    paths:
      - "cpp/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build

      - name: Build
        run: |
          cmake --build cpp/build