name: ML CI

on:
  workflow_dispatch:
  push:
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt

      - name: Check ML code
        run: |
          python -m compileall ml/src
          PYTHONPATH=. pytest ml/tests -q

      - name: Run validation, processing, and model pipeline
        env:
          PYTHONPATH: .
          PIPELINE_OUTPUT: ${{ runner.temp }}/paysim-ci-output
        run: |
          python -m ml.src.pipeline \
            --input ml/tests/fixtures/paysim_fixture.csv \
            --output-dir "$PIPELINE_OUTPUT" \
            --model-name paysim-ci \
            --version "${{ github.sha }}"

      - name: Upload ML pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paysim-pipeline-${{ github.sha }}
          path: ${{ runner.temp }}/paysim-ci-output
          if-no-files-found: error
