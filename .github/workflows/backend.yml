name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "cpp/**"
      - "database/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "cpp/**"
      - "database/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/banking_fraud
      FRAUD_ENGINE_PATH: ${{ github.workspace }}/cpp/build/fraud_engine
      PYTHONPATH: backend
      ML_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banking_fraud
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d banking_fraud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ postgresql-client

      - name: Normalize CMake filename casing
        run: |
          if [ -f cpp/CmakeLists.txt ] && [ ! -f cpp/CMakeLists.txt ]; then
            mv cpp/CmakeLists.txt cpp/CMakeLists.txt
          fi
          test -f cpp/CMakeLists.txt

      - name: Build C++ fraud engine
        run: |
          cmake -S cpp -B cpp/build -DBUILD_TESTING=ON
          cmake --build cpp/build --config Release --parallel
          ctest --test-dir cpp/build --output-on-failure

      - name: Initialize PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/setup.sql

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests -q
